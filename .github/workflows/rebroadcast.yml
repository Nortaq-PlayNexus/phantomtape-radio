name: rebroadcast

# SoundCloud hands out presigned stream URLs that expire, so the catalogue is
# re-resolved every night. Same rhythm as the snake transmitter on the profile.
on:
  schedule:
    - cron: "17 0 * * *"      # 00:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebroadcast
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: python -m pip install --quiet requests

      - name: resolve catalogue
        run: python tools/build_catalogue.py

      - name: commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "catalogue unchanged - nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "rebroadcast: refresh catalogue + presigned stream urls"
          git push

      - name: summary
        run: |
          {
            echo "### REBROADCAST COMPLETE"
            echo ""
            echo '```'
            tail -n 6 /dev/null 2>/dev/null || true
            python - <<'PY'
            import json, pathlib
            d = json.loads(pathlib.Path("data/catalogue.json").read_text(encoding="utf-8"))
            w = json.loads(pathlib.Path("data/waveforms.json").read_text(encoding="utf-8"))
            print(f"transmissions : {len(d['tracks'])}")
            print(f"waveforms     : {len(w)}")
            print(f"followers     : {d['meta']['followers']}")
            print(f"runtime       : {d['meta']['total_ms']/3600000:.2f} hrs")
            print(f"built         : {d['meta']['built']}")
            PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
